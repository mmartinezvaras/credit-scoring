# Un solo tema de Streamlit (claro). El modo oscuro lo pone el botón de la app con CSS, al instante.
[theme]
base = "light"
primaryColor = "#000000"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#000000"

[client]
# Las páginas se enlazan desde la propia app (st.page_link), no desde el menú lateral automático.
showSidebarNavigation = false
